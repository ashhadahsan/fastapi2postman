[project]
name = "fastapi2postman"
version = "0.3.0"
description = "Turn a FastAPI app into a Postman collection you can run straight away."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashhad Ahsan Rehman", email = "ashhadahsan@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.105"]
keywords = ["fastapi", "postman", "newman", "openapi", "api", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/ashhadahsan/fastapi2postman"
Changelog = "https://github.com/ashhadahsan/fastapi2postman/blob/main/CHANGELOG.md"

[project.scripts]
fastapi2postman = "fastapi2postman.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# FastAPI warns about every route with several methods; the collection doesn't use operation ids.
filterwarnings = ["ignore:Duplicate Operation ID:UserWarning"]

[tool.coverage.run]
source = ["fastapi2postman"]

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "python-multipart>=0.0.33",
    "ruff>=0.17.3",
    "uvicorn>=0.54.0",
]
